name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...
      - name: go build
        run: go build ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build kv-node image
        run: docker build -f deploy/docker/node.Dockerfile -t boilerpulse-node:ci .
      - name: Build gateway image
        run: docker build -f deploy/docker/gateway.Dockerfile -t boilerpulse-gateway:ci .
      - name: Build ingest image
        run: docker build -f deploy/docker/ingest.Dockerfile -t boilerpulse-ingest:ci .
      - name: Build frontend image
        run: docker build -f deploy/docker/frontend.Dockerfile -t boilerpulse-frontend:ci .
